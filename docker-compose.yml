services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: multi_tenant_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d multi_tenant_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/multi_tenant_crm
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-docker}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      RUN_SEED: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pgdata:
